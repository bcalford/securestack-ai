name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: Duplicate and secret guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run duplicate-file guardrail
        run: ./scripts/check-duplicates.sh

      - name: Run secret-safety guardrail
        run: ./scripts/check-secrets.sh

  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn test

      - name: Package backend
        working-directory: backend
        run: mvn package

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=vitest-results.xml

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: |
            frontend/vitest-results.xml
            frontend/coverage/
            frontend/test-results/
          if-no-files-found: ignore

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate default Docker Compose config
        run: docker compose config

      - name: Validate PostgreSQL Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.postgres.yml config
